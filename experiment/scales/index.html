<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slider Scale Task</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspsych@8.0.0/css/jspsych.css" />
  <style>
    body {
      font-family: 'Lato', sans-serif;
      background: #fafafa;
      color: #1a1a1a;
    }

    /* ---------- instructions ---------- */
    .instructions {
      max-width: 720px;
      margin: 2rem auto;
      text-align: left;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .instructions h2 {
      text-align: center;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .instructions p {
      margin: 0.9rem 0;
    }

    .instructions kbd {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      background: #f0f0f0;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      padding: 0.1rem 0.5rem;
      font-size: 0.95em;
    }

    /* ---------- survey-text (demographics) ---------- */
    #jspsych-survey-text,
    .jspsych-survey-text {
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
      font-family: 'Lato', sans-serif;
    }

    /* ---------- consent ---------- */
    .consent {
      max-width: 720px;
      margin: 2rem auto 3rem;
      text-align: left;
      line-height: 1.6;
      font-size: 1rem;
    }

    .consent h2 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 1.25rem;
    }

    .consent h3 {
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 1.6rem;
      margin-bottom: 0.4rem;
    }

    .consent p {
      margin: 0.5rem 0;
    }

    .consent-options {
      margin: 1.5rem 0 1rem;
      padding: 1rem 1.25rem;
      border-top: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
    }

    .consent-option {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0;
      cursor: pointer;
      user-select: none;
      font-size: 1rem;
    }

    .consent-option input[type="radio"] {
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
      accent-color: #1f6fa8;
    }

    .consent-actions {
      text-align: center;
      margin-top: 1.5rem;
    }

    .consent-continue:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .begin-button {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      padding: 0.85rem 3rem;
      margin-top: 1.5rem;
      background: #1f6fa8;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 100ms ease, transform 100ms ease,
        box-shadow 100ms ease;
    }

    .begin-button:hover {
      background: #185a8a;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(31, 111, 168, 0.25);
    }

    .begin-button:active {
      transform: translateY(0);
      box-shadow: 0 1px 3px rgba(31, 111, 168, 0.2);
    }

    .begin-button:focus-visible {
      outline: 3px solid #a0c5e2;
      outline-offset: 2px;
    }

    /* ---------- slider ---------- */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 70%;
      height: 6px;
      background: black;
      display: block;
      margin: 40px auto;
      outline: none;
    }

    /* slider wrapper*/
    .slider-wrapper {
      text-align: center;
    }

    /* jsPsych container */
    .jspsych-html-slider-response {
      text-align: center;
    }

    /* track */
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      background: black;
    }

    input[type="range"]::-moz-range-track {
      height: 6px;
      background: black;
    }

    /* hide thumb (bubble) */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      background: black;
      cursor: pointer;
      width: 1px;
      height: 24px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 1 px;
      height: 24px;
      background: black;
      border: none;
    }
  </style>
</head>

<body>
  <script type="module" src="./setup.js"></script>
</body>

</html>
