<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triplet Similarity Task</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspsych@8.0.0/css/jspsych.css" />
  <style>
    body {
      font-family: 'Lato', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafafa;
      color: #1a1a1a;
    }

    /* ---------- instructions ---------- */
    .instructions {
      max-width: 720px;
      margin: 2rem auto;
      text-align: left;
      line-height: 1.6;
      font-size: 1.05rem;
    }
    .instructions h2 {
      text-align: center;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .instructions p {
      margin: 0.9rem 0;
    }
    .instructions kbd {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      background: #f0f0f0;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      padding: 0.1rem 0.5rem;
      font-size: 0.95em;
    }

    /* ---------- triplet stage (used in both example and live trials) ---------- */
    .triplet-stage {
      text-align: center;
      margin: 2.5rem 0;
    }
    .example-stage {
      margin: 1.75rem auto;
    }
    .example-label {
      font-family: 'Lato', sans-serif;
      font-weight: 400;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    /* All three words share these styles — bold Lato, same size, same pill shape. */
    .triplet-word {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 0.005em;
      display: inline-block;
      padding: 1rem 2rem;
      min-width: 12rem;
      border-radius: 14px;
      background: transparent;
      text-align: center;
    }
    .triplet-target {
      margin: 0.5rem 0 2.25rem;
    }
    .triplet-choices {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 3rem;
    }

    /* Choices behave like the target by default, but light up on hover/select. */
    .triplet-choice {
      cursor: pointer;
      user-select: none;
      transition: background-color 90ms ease, transform 90ms ease,
        box-shadow 90ms ease;
    }
    .triplet-choice:hover,
    .triplet-choice:focus-visible {
      background: #eaf3fb;
      transform: translateY(-2px);
      outline: none;
    }
    .triplet-choice.selected {
      background: #b8d8ee;
      transform: scale(1.05);
      box-shadow: 0 4px 14px rgba(31, 111, 168, 0.22);
    }
  </style>
</head>
<body>
  <script type="module" src="./setup.js"></script>
</body>
</html>
